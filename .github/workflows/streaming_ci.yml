name: Streaming Pipeline CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark delta-spark confluent-kafka psycopg2-binary pandas numpy

      - name: Validate Python Files
        run: |
          python -m py_compile producer/producer.py
          python -m py_compile consumer/bronze_stream.py
          python -m py_compile transformation/silver.py
          python -m py_compile transformation/gold.py