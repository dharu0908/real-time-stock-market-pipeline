apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  labels:
    app: stock-market-pipeline
    component: kafka
spec:
  selector:
    app: stock-market-pipeline
    component: kafka
  ports:
    - name: kafka
      protocol: TCP
      port: 9092
      targetPort: 9092
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: stock-market-pipeline
    component: postgres
spec:
  selector:
    app: stock-market-pipeline
    component: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  labels:
    app: stock-market-pipeline
    component: elasticsearch
spec:
  selector:
    app: stock-market-pipeline
    component: elasticsearch
  ports:
    - name: http
      protocol: TCP
      port: 9200
      targetPort: 9200
    - name: transport
      protocol: TCP
      port: 9300
      targetPort: 9300
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  labels:
    app: stock-market-pipeline
    component: dashboard
spec:
  selector:
    app: stock-market-pipeline
    component: dashboard
  ports:
    - name: streamlit
      protocol: TCP
      port: 8501
      targetPort: 8501
  type: LoadBalancer
